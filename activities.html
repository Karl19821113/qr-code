<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>桃園恩寵靈糧堂課程＆活動報名</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --card: #fffaf0; --edge: #dcb784; --edge-dark: #c79b60;
      --brown: #5b4129; --brown-soft: #8a6f50;
      --shadow: rgba(140, 95, 50, 0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', 'Baloo 2', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% -8%, #fbf3e0 0%, #f3e6cb 55%, #ecdcbd 100%);
      background-attachment: fixed; min-height: 100vh; color: var(--brown); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 520px; margin: 0 auto; padding: 20px 16px 44px; position: relative; }
    /* 柔和黏土光點裝飾 */
    .container::before, .container::after { content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    .container::before { width: 180px; height: 180px; top: 8%; right: -44px; background: radial-gradient(circle, rgba(240,196,77,0.20), transparent 70%); }
    .container::after  { width: 210px; height: 210px; bottom: 5%; left: -54px; background: radial-gradient(circle, rgba(224,122,100,0.14), transparent 70%); }

    .header { text-align: center; padding: 16px 0 22px; position: relative; z-index: 1; }
    .header h1 {
      font-size: 1.55rem; font-weight: 900; letter-spacing: 1px; color: #5a3e22;
      text-shadow: 0 2px 0 #fff, 0 3px 7px rgba(150,100,50,0.25);
    }
    .header p { color: var(--brown-soft); font-size: 0.86rem; margin-top: 8px; font-weight: 500; }

    .cat { margin-bottom: 24px; position: relative; z-index: 1; }
    .cat-title {
      display: inline-flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 900; color: #fff;
      background: linear-gradient(180deg, #b27f4b, #99662f); padding: 8px 18px; border-radius: 22px;
      margin-bottom: 14px; border: 2px solid #c08c54;
      box-shadow: 0 4px 0 #7d5223, 0 6px 11px var(--shadow);
    }

    /* 黏土磚塊卡片：厚邊 + 底部立體厚度 + 柔和暖陰影 */
    .act-card {
      display: block; text-decoration: none; background: var(--card);
      border: 3px solid var(--edge); border-radius: 22px; padding: 16px 18px; margin-bottom: 15px;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      box-shadow: 0 5px 0 var(--edge-dark), 0 10px 16px var(--shadow);
    }
    .act-card:hover, .act-card:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--edge-dark), 0 6px 12px var(--shadow); }
    .act-card-closed { cursor: default; background: #f1e7d6; border-color: #d8c7ab; box-shadow: 0 5px 0 #cab791, 0 10px 16px var(--shadow); }
    .act-card-closed:hover { transform: none; box-shadow: 0 5px 0 #cab791, 0 10px 16px var(--shadow); }

    .act-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .act-name { font-size: 1.08rem; font-weight: 900; color: #4a3322; }
    .act-meta { font-size: 0.78rem; color: var(--brown-soft); margin-top: 5px; font-weight: 500; }

    /* 軟紅色黏土「報名」鈕 */
    .act-go {
      flex: 0 0 auto; color: #fff; font-weight: 900; font-size: 0.9rem; white-space: nowrap;
      background: linear-gradient(180deg, #e8866f, #d35f49); padding: 9px 18px; border-radius: 20px;
      border: 2px solid #ee9c89; box-shadow: 0 3px 0 #b54a36, 0 4px 8px rgba(180,80,60,0.3);
    }
    .act-go-closed {
      background: linear-gradient(180deg, #cdb79b, #b8a17f); color: #fff;
      border-color: #d8c6a8; box-shadow: 0 3px 0 #9c8765, 0 4px 8px var(--shadow);
    }

    .empty {
      color: var(--brown-soft); font-size: 0.86rem; padding: 14px 16px; font-weight: 500;
      background: rgba(255,253,246,0.6); border: 2px dashed #d9c5a3; border-radius: 16px;
    }
    .loading { text-align: center; color: var(--brown-soft); font-size: 0.9rem; padding: 36px 0; font-weight: 500; }
    .footer { text-align: center; color: rgba(120,90,55,0.5); font-size: 0.78rem; padding-top: 18px; font-weight: 500; position: relative; z-index: 1; }
  </style>
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>桃園恩寵靈糧堂課程＆活動報名</h1>
      <p>請選擇您要報名的課程或活動</p>
    </header>
    <div id="catContainer"><div class="loading">載入中…</div></div>
    <footer class="footer"><p>桃園恩寵靈糧堂 © 2026</p></footer>
  </div>

  <script>
    // ===================== 設定（部署前請確認）=====================
    // GAS Web App 的 /exec 網址（用來 fetch 活動清單 + 組報名連結）
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbw20US19T3_iTqY764kMTRvW1-jDYhRD8Z3JFCyscK0ZzfiFFwg-QtOwLafwHZPGZOU/exec';
    var LIFF_ID = '2010238846-3fv6sKDm';
    // =============================================================

    var USER_ID = '';
    var DATA = { activities: [], categories: ['門訓課程', '特會活動', '專題講座'] };
    var catIcons = { '門訓課程': '📚', '特會活動': '🔥', '專題講座': '🎤' };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function render() {
      var cats = (DATA.categories && DATA.categories.length) ? DATA.categories : ['門訓課程', '特會活動', '專題講座'];
      var html = '';
      cats.forEach(function (cat) {
        var items = (DATA.activities || []).filter(function (a) { return a.category === cat; });
        html += '<div class="cat"><div class="cat-title">' + (catIcons[cat] || '📌') + ' ' + esc(cat) + '</div>';
        if (!items.length) {
          html += '<div class="empty">目前無相關活動</div>';
        } else {
          items.forEach(function (a) {
            var inner = '<div class="act-row">'
              + '<div><div class="act-name">' + esc(a.name) + '</div>'
              + (a.deadline ? '<div class="act-meta">📅 報名截止：' + esc(a.deadline) + '</div>' : '')
              + '</div>'
              + (a.open ? '<span class="act-go">報名 ›</span>' : '<span class="act-go act-go-closed">🔒 尚未開放</span>')
              + '</div>';
            // 用乾淨的 GAS_URL 自組連結（避開 /a/網域/ 與快取殘留），並帶上 uid 讓報名表單抓 LINE 身分
            var href = GAS_URL + '?event=' + encodeURIComponent(a.id) + (USER_ID ? ('&uid=' + encodeURIComponent(USER_ID)) : '');
            html += a.open
              ? ('<a class="act-card" href="' + esc(href) + '">' + inner + '</a>')
              : ('<div class="act-card act-card-closed">' + inner + '</div>');
          });
        }
        html += '</div>';
      });
      document.getElementById('catContainer').innerHTML = html;
    }

    function loadActivities() {
      fetch(GAS_URL + '?action=getActivitiesLanding', { method: 'GET', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d) DATA = d; render(); })
        .catch(function () {
          document.getElementById('catContainer').innerHTML =
            '<div class="loading" style="color:#ef4444;">活動載入失敗，請稍後再試</div>';
        });
    }

    function start() {
      if (typeof liff === 'undefined') { loadActivities(); return; }
      liff.init({ liffId: LIFF_ID }).then(function () {
        if (liff.isLoggedIn()) {
          liff.getProfile()
            .then(function (p) { USER_ID = p.userId || ''; })
            .catch(function () {})
            .then(loadActivities);
        } else {
          // 外部瀏覽器未登入 → 導去 LINE 登入以取得身分（在 LINE 內開啟不會走到這）
          liff.login();
        }
      }).catch(function () {
        loadActivities();  // LIFF 失敗也照常顯示活動（只是抓不到 uid）
      });
    }

    start();
  </script>
</body>

</html>
